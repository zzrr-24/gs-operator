apiVersion: v1
kind: Namespace
metadata:
  name: gw-green
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: connector
  namespace: gw-green
spec:
  replicas: 3
  serviceName: connector-headless
  selector:
    matchLabels:
      app: connector
      adventure: connector
  template:
    metadata:
      labels:
        app: connector
        adventure: connector
    spec:
      containers:
      - name: connector
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        command:
        - /bin/sh
        - -c
        - |
          ORDINAL=$(echo "$POD_NAME" | awk -F'-' '{print $NF}')
          cat > /etc/nginx/conf.d/default.conf << EOF
          server {
              listen 80;
              server_name _;

              location / {
                  return 200 "connector-green-$ORDINAL\n";
                  add_header Content-Type text/plain;
              }
          }
          EOF
          nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: connector-headless
  namespace: gw-green
spec:
  clusterIP: None
  selector:
    app: connector
    adventure: connector
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: logingame-green
  namespace: gw-green
  labels:
    app: logingame-green
spec:
  containers:
  - name: http
    image: nginx:alpine
    ports:
    - containerPort: 80
      name: http
    env:
    - name: RESPONSE
      value: logingame-green
    command:
    - /bin/sh
    - -c
    - |
      cat > /etc/nginx/conf.d/default.conf << EOF
      server {
          listen 80;
          server_name _;

          location / {
              return 200 "$RESPONSE\n";
              add_header Content-Type text/plain;
          }
      }
      EOF
      nginx -g 'daemon off;'
---
