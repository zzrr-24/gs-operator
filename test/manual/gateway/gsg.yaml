---
apiVersion: gs.zzrr.io/v1alpha1
kind: GameService
metadata:
  name: gateway-green
  namespace: gw-green
spec:
  trafficMode: Gateway
  route:
    host: game.example.com
    pathType: Prefix
    pathPrefix: "/connector"
    port: 80
  gateway:
    parentRef:
      name: shared-gateway
      namespace: gateway-system
      sectionName: http
  extraIngress:
    name: gamelogin
    paths:
    - pathType: Prefix
      path: /serverlogin
      serviceName: logingame-green
      port: 9020
    - pathType: Prefix
      path: /servergovern
      serviceName: servergovern-green
      port: 9015
    - pathType: Prefix
      path: /backend
      serviceName: backend-green
      port: 9010
    - pathType: Prefix
      path: /statsgm
      serviceName: statsgm-green
      port: 9012
  connectorNamespace: gw-green
  podLabelKey: adventure
  podLabelValue: connector
  deployGroup:
    role: green
    active: false
