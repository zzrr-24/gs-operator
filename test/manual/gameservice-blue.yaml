apiVersion: gs.zzrr.io/v1alpha1
kind: GameService
metadata:
  name: blue
  namespace: gsb
spec:
  route:
    host: adventure.zzrr.io
    #host: game.zzrr.io
    pathType: Prefix
    pathPrefix: "/wsgame"
    port: 3010
  ingress:
    ingressClassName: higress
    annotations:
      higress.ingress.kubernetes.io/proxy-read-timeout: "300s"
      higress.ingress.kubernetes.io/proxy-send-timeout: "300s"
        #higress.ingress.kubernetes.io/rewrite-target: "/"
  connectorNamespace: gsb
  podLabelKey: adventure
  podLabelValue: connector
  deployGroup:
    role: blue
    active: true
  retention:
    enabled: true
    defaultDuration: 24h
